"on":
    push:
        branches:
            - latest
name: Deploy to sovabids
jobs:
    porter-deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Set Github tag
              id: vars
              run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
            - name: Setup porter
              uses: porter-dev/setup-porter@v0.2.0
            - name: Deploy stack
              timeout-minutes: 30
              run: porter apply
              env:
                PORTER_APP_NAME: sovabids
                PORTER_CLUSTER: "6200"
                PORTER_DEPLOYMENT_TARGET_ID: fe3bc104-680c-48b5-986e-324e0743dacf
                PORTER_HOST: https://dashboard.porter.run
                PORTER_PROJECT: "20232"
                PORTER_TAG: ${{ steps.vars.outputs.sha_short }}
                PORTER_TOKEN: ${{ secrets.PORTER_APP_20232_28277 }}
